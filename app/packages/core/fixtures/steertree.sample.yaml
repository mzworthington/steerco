apiVersion: steerco.dev/v1alpha1
kind: SteerTree
metadata:
  name: northwind-group-h2-alignment
  title: Northwind Group H2 alignment
  description:
    'Synthetic large-org retailer demo (~450 people across ~60 teams, 12 domains, 36 streams).
    Includes intentional analysis smells: oversized checkout mega-team, digital experience blob spanning
    streams/domains, shared POS stream, and elevated collaboration chatter - for the analysis engine.'
spec:
  vision:
    Ship customer promises in days, not weeks, across digital, store, and B2B - without burning
    out stream-aligned teams
  techRadarUrl: https://example.com/tech-radar
  outcomes:
    - id: out_promise
      title: Reliable customer promises
      summary: Customers receive accurate delivery and pickup estimates they can trust
      status: on_track
      metrics:
        - id: met_promise_hit
          title: Promise hit rate
          unit: percent
          current: 91
          baseline: 74
          target: 95
          interpretation: Climbing, still short of the target band
        - id: met_cycle_days
          title: Promise-to-fulfilil days
          unit: days
          current: 4.2
          baseline: 9.0
          target: 3.0
          interpretation: Improved, not yet at target
        - id: met_shared_wait
          title: Shared-service wait time
          unit: days
          current: 3.5
          baseline: 2.0
          target: 1.0
          interpretation: Bottleneck risk for two bets
    - id: out_store
      title: Confident store operations
      summary: Store teams trust digital tools for stock, staffing, and checkout
      status: at_risk
      metrics:
        - id: met_pos_uptime
          title: POS uptime
          unit: percent
          current: 98.2
          baseline: 96.0
          target: 99.5
          interpretation: Improving, still fragile under peak
  bets:
    - id: bet_pickup
      outcomeId: out_promise
      title: Same-day pickup reliability
      successSignal: Store pickup promises miss less than five percent of orders
      killCriteria: Hit rate stays flat after one quarter of staffing and routing changes
      status: on_track
      fundedTeamIds:
        - team_storefront
        - team_catalog
        - team_checkout
        - team_payments_ux
        - team_promotions
      metricIds:
        - met_promise_hit
      primaryMetricId: met_promise_hit
      reviewDate: '2026-09-30'
      horizon: Q3 review
      fundingStance: exploit
      kind: opportunity
      valueRank: 1
    - id: bet_fulfilil
      outcomeId: out_promise
      title: Shared fulfilment spine
      successSignal: New channels reuse one fulfilment path within two weeks of launch
      killCriteria: Fewer than two channels adopt the spine after two quarters
      status: at_risk
      fundedTeamIds:
        - team_fulfilil
        - team_warehouse
        - team_lastmile
        - team_inventory
        - team_marketplace
      metricIds:
        - met_cycle_days
        - met_shared_wait
      primaryMetricId: met_cycle_days
      reviewDate: '2026-10-15'
      horizon: Q3 review
      fundingStance: explore
      kind: capability
      valueRank: 2
    - id: bet_loyalty
      outcomeId: out_promise
      title: Loyalty ledger unification
      successSignal: Points balance disputes drop by half
      killCriteria: Promise hit rate unchanged after two quarters while programme cost rises
      status: stop_ready
      fundedTeamIds:
        - team_loyalty_cx
        - team_care
        - team_returns
      metricIds:
        - met_promise_hit
      fundingStance: sustain
      kind: opportunity
      valueRank: 5
    - id: bet_pos_resilience
      outcomeId: out_store
      title: Peak-ready POS
      successSignal: No more than one severity-1 POS incident per peak weekend
      killCriteria: Uptime flat after two peak events despite investment
      status: on_track
      fundedTeamIds:
        - team_pos
        - team_workforce
        - team_shelf
        - team_identity
        - team_dev_platform
      metricIds:
        - met_pos_uptime
      primaryMetricId: met_pos_uptime
      reviewDate: '2026-11-15'
      horizon: Q4 review
      fundingStance: exploit
      kind: capability
      valueRank: 3
    - id: bet_insights
      outcomeId: out_promise
      title: Decision-grade customer insight
      successSignal: Experiment cycle time under one week for top funnels
      killCriteria: Insight unused in two consecutive quarterly reviews
      status: on_track
      fundedTeamIds:
        - team_analytics
        - team_experimentation
        - team_b2b
      metricIds:
        - met_promise_hit
      primaryMetricId: met_promise_hit
      reviewDate: '2026-12-01'
      horizon: Q4 review
      fundingStance: explore
      kind: opportunity
      valueRank: 4
    - id: bet_blob_split
      outcomeId: out_promise
      title: Split the digital experience blob
      successSignal: Storefront and care each have a dedicated stream-aligned team with clear fracture planes
      killCriteria: Cycle time stays flat after one quarter of coaching and fracture-plane work
      status: at_risk
      fundedTeamIds:
        - team_digital_blob
        - team_enablement
      metricIds:
        - met_cycle_days
      primaryMetricId: met_cycle_days
      reviewDate: '2026-10-15'
      horizon: H2 review
      fundingStance: explore
      kind: capability
      valueRank: 6

packages:
  - '.'
  - 'packages/*'

allowBuilds:
  core-js: true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - vite
  - '@pulumi/cloudflare'
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0
  - tmp
  - undici
  - uuid
  - mermaid
  - lodash-es
  - yaml
  - fast-uri

# Dependabot / transitive security pins (dev-tooling only).
overrides:
  tmp: '>=0.2.7'
  uuid: '>=11.1.1'
  'undici@7': '7.29.0'
  'undici@8': '>=8.9.0'
  lodash-es: '>=4.17.24'
  yaml: '>=2.8.3'
  mermaid: '>=11.16.1'
  fast-uri: '>=4.1.3'

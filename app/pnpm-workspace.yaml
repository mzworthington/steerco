packages:
  - '.'
  - 'packages/*'

allowBuilds:
  core-js: false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - vite
  - '@pulumi/cloudflare'
  - miniflare@5.20260801.1-alpha || 5.20260910.0-alpha
  - wrangler@4.120.0 || 4.131.0
  - tmp
  - undici
  - uuid
  - mermaid
  - lodash-es
  - yaml
  - fast-uri
  - '@posthog/browser-common@0.8.3'
  - '@posthog/core@1.53.2'
  - '@posthog/types@1.411.1'
  - posthog-js@1.430.2
  - zod@4.6.2
  - js-yaml
  - '@puppeteer/browsers'
  - qs

# Dependabot / transitive security pins (dev-tooling only).
overrides:
  tmp: '>=0.2.7'
  uuid: '>=11.1.1'
  'undici@7': '7.29.0'
  'undici@8': '>=8.9.0'
  lodash-es: '>=4.17.24'
  yaml: '>=2.8.3'
  mermaid: '>=11.16.1'
  fast-uri: '>=4.1.3'
  sharp: '>=0.35.4'
  'js-yaml@3': '3.15.2'
  'js-yaml@4': '4.3.2'
  '@puppeteer/browsers': '3.2.2'
  qs: '>=6.16.0'

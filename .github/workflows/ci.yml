name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy build to Cloudflare Pages after CI (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@26.7.0
          cache: true
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code (knip)
        run: pnpm knip

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@26.7.0
          cache: true
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Unit tests
        run: pnpm test

      - name: SteerSpec mismatch check
        run: pnpm --filter @steerco/core test -- checkSteerSpec

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@26.7.0
          cache: true
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: app/dist
          retention-days: 7

  deploy:
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_to_cloudflare)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: app/dist

      - name: Inject Web Analytics beacon
        uses: mzworthington/edge-dns/.github/actions/inject-web-analytics-beacon@main
        with:
          html-path: app/dist
          spa: 'true'
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=${{ vars.PULUMI_PAGES_PROJECT_NAME || 'steerco' }}

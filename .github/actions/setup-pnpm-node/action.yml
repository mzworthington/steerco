name: Setup pnpm + Node
description: Install pnpm and Node in a nested workspace; retry only npm 5xx on the pnpm binary.
inputs:
  version:
    description: pnpm version
    required: true
  runtime:
    description: Runtime spec (for example node@26.7.0)
    required: true
  cache-dependency-path:
    description: Lockfile path relative to GITHUB_WORKSPACE
    required: true
  working-directory:
    description: Directory that contains package.json (job defaults.run.working-directory does not apply to uses:)
    required: false
    default: app
runs:
  using: composite
  steps:
    - name: Setup pnpm + Node (attempt 1)
      id: pnpm-1
      continue-on-error: true
      uses: pnpm/setup@v2
      with:
        version: ${{ inputs.version }}
        runtime: ${{ inputs.runtime }}
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        working-directory: ${{ inputs.working-directory }}
        install: true
    - name: Wait before pnpm setup retry
      if: steps.pnpm-1.outcome == 'failure'
      shell: bash
      run: sleep 8
    - name: Setup pnpm + Node (attempt 2)
      if: steps.pnpm-1.outcome == 'failure'
      uses: pnpm/setup@v2
      with:
        version: ${{ inputs.version }}
        runtime: ${{ inputs.runtime }}
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        working-directory: ${{ inputs.working-directory }}
        install: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="React Cloudflare Template">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="55%" stop-color="#f7f9fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="18%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="88%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f9fb"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Drafting grid -->
  <g stroke="#0b1220" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 63 H1200 M0 126 H1200 M0 189 H1200 M0 252 H1200 M0 315 H1200 M0 378 H1200 M0 441 H1200 M0 504 H1200 M0 567 H1200"/>
    <path d="M80 0 V630 M160 0 V630 M240 0 V630 M320 0 V630 M400 0 V630 M480 0 V630 M560 0 V630 M640 0 V630 M720 0 V630 M800 0 V630 M880 0 V630 M960 0 V630 M1040 0 V630 M1120 0 V630"/>
  </g>

  <!-- Mark (right) -->
  <g transform="translate(730, 90) scale(0.9)">
    <rect width="500" height="500" rx="72" fill="#f7f9fb" fill-opacity="0.55"/>
    <g stroke="#0b1220" stroke-opacity="0.06" stroke-width="1.5">
      <path d="M80 0 V500 M160 0 V500 M240 0 V500 M320 0 V500 M400 0 V500"/>
      <path d="M0 80 H500 M0 160 H500 M0 240 H500 M0 320 H500 M0 400 H500"/>
    </g>
    <rect x="148" y="108" width="248" height="292" rx="28"
          fill="#eef2f6" stroke="#0b1220" stroke-opacity="0.12" stroke-width="3"
          transform="rotate(-7 272 254)"/>
    <rect x="148" y="118" width="248" height="292" rx="28"
          fill="#f7f9fb" stroke="#0b1220" stroke-opacity="0.16" stroke-width="3"
          transform="rotate(-3.5 272 264)"/>
    <rect x="148" y="128" width="248" height="292" rx="28"
          fill="url(#pageFace)" stroke="#0b1220" stroke-opacity="0.22" stroke-width="3.5"/>
    <path d="M148 156 A28 28 0 0 1 176 128 H176 V420 H176 A28 28 0 0 1 148 392 Z"
          fill="url(#accentBar)"/>
    <g stroke="#0b1220" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round">
      <line x1="204" y1="188" x2="348" y2="188"/>
      <line x1="204" y1="224" x2="320" y2="224"/>
      <line x1="204" y1="260" x2="336" y2="260"/>
    </g>
    <path d="M286 318 L320 352 L286 386"
          fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="352" r="10" fill="#0f766e"/>
  </g>

  <!-- Wordmark (left) -->
  <text x="88" y="250"
        font-family="Syne, ui-sans-serif, system-ui, sans-serif"
        font-size="58" font-weight="800" fill="#0b1220" letter-spacing="-1.5">
    React Cloudflare
  </text>
  <text x="88" y="318"
        font-family="Syne, ui-sans-serif, system-ui, sans-serif"
        font-size="58" font-weight="800" fill="#0b1220" letter-spacing="-1.5">
    Template
  </text>
  <text x="88" y="390"
        font-family="Source Sans 3, ui-sans-serif, system-ui, sans-serif"
        font-size="28" font-weight="600" fill="#4a5568">
    Hosting, docs, and CI already wired
  </text>
  <rect x="88" y="430" width="72" height="6" rx="3" fill="#0f766e"/>
</svg>

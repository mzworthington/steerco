<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="SteerCo shipped logo pack review sheet">
  <rect width="1000" height="720" fill="#f7f5f3"/>
  <text x="40" y="48" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#041c38">Shipped logo - review</text>
  <text x="40" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5c6570">Current design-pack mark - circles + arrow - ink / ocean / paper tokens</text>

  <defs>
    <path id="arrow"
          d="M 117.98 -15.16 A 18 18 0 0 1 117.98 15.16 L -130 102 Q -48 0 -130 -102 Z"/>
    <!-- Full circles+arrow lockup at native coords (249.4 x 82.6), ink -->
    <g id="lockup-ink">
      <circle cx="38" cy="38" r="38" fill="#041c38"/>
      <circle cx="128" cy="38" r="38" fill="#041c38"/>
      <g transform="translate(218 38) scale(0.293879) rotate(-45) translate(17.3702 0)">
        <use href="#arrow" fill="#041c38"/>
      </g>
    </g>
    <g id="lockup-ocean">
      <circle cx="38" cy="38" r="38" fill="#044a88"/>
      <circle cx="128" cy="38" r="38" fill="#044a88"/>
      <g transform="translate(218 38) scale(0.293879) rotate(-45) translate(17.3702 0)">
        <use href="#arrow" fill="#044a88"/>
      </g>
    </g>
  </defs>

  <!-- Row 1: square marks -->
  <g transform="translate(100 175)">
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="#fbfaf8"/>
    <g transform="scale(0.34) rotate(-45) translate(17.3702 0)">
      <use href="#arrow" fill="#041c38"/>
    </g>
    <text x="0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#041c38" font-weight="600">mark *</text>
  </g>

  <g transform="translate(280 175)">
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="#041c38"/>
    <g transform="scale(0.34) rotate(-45) translate(17.3702 0)">
      <use href="#arrow" fill="#f7f5f3"/>
    </g>
    <text x="0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">mark-dark</text>
  </g>

  <g transform="translate(460 175)">
    <rect x="-56" y="-56" width="112" height="112" rx="20" fill="#041c38"/>
    <g transform="scale(0.34) rotate(-45) translate(17.3702 0)">
      <use href="#arrow" fill="#f7f5f3"/>
    </g>
    <text x="0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">favicon</text>
  </g>

  <g transform="translate(640 175)">
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="#e8edf3"/>
    <g transform="scale(0.34) rotate(-45) translate(17.3702 0)">
      <use href="#arrow" fill="#044a88"/>
    </g>
    <text x="0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">ocean tint</text>
  </g>

  <g transform="translate(820 175)">
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="#044a88"/>
    <g transform="scale(0.34) rotate(-45) translate(17.3702 0)">
      <use href="#arrow" fill="#f7f5f3"/>
    </g>
    <text x="0" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">ocean field</text>
  </g>

  <!-- Row 2: motif lockups + size ladder -->
  <!-- Native lockup width ~249; scale 0.9 => ~224; centre at x=200 -->
  <g transform="translate(200 340)">
    <g transform="translate(-112 -34) scale(0.9)">
      <use href="#lockup-ink"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#041c38" font-weight="600">mark-lockup *</text>
  </g>

  <g transform="translate(520 340)">
    <g transform="translate(-112 -34) scale(0.9)">
      <use href="#lockup-ocean"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">lockup ocean</text>
  </g>

  <g transform="translate(820 340)">
    <g transform="translate(-48 -8)">
      <g transform="translate(0 0)">
        <g transform="scale(0.20) rotate(-45) translate(17.3702 0)">
          <use href="#arrow" fill="#041c38"/>
        </g>
        <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5c6570">24</text>
      </g>
      <g transform="translate(48 0)">
        <g transform="scale(0.14) rotate(-45) translate(17.3702 0)">
          <use href="#arrow" fill="#041c38"/>
        </g>
        <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5c6570">16</text>
      </g>
      <g transform="translate(88 0)">
        <g transform="scale(0.10) rotate(-45) translate(17.3702 0)">
          <use href="#arrow" fill="#041c38"/>
        </g>
        <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5c6570">12</text>
      </g>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">small sizes</text>
  </g>

  <!-- Row 3: wordmark lockups -->
  <g transform="translate(40 480)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c6570">Wider treatment = motif lockup or mark + wordmark</text>

    <g transform="translate(48 80)">
      <g transform="scale(0.28) rotate(-45) translate(17.3702 0)">
        <use href="#arrow" fill="#041c38"/>
      </g>
      <text x="40" y="12" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#041c38">SteerCo</text>
    </g>

    <g transform="translate(420 62)">
      <g transform="scale(0.55)">
        <use href="#lockup-ink"/>
      </g>
      <text x="150" y="32" font-family="Fraunces, Georgia, serif" font-size="32" font-weight="600" fill="#041c38">SteerCo</text>
    </g>

    <text x="0" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6570">arrow + wordmark - circles+arrow + wordmark - sources in design-pack/</text>
  </g>
</svg>
